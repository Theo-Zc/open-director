<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #0b1120; color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  .wrap { padding: 96px 120px; display: flex; flex-direction: column; gap: 48px; height: 100%; justify-content: center; }
  h1 { margin: 0; font-size: 64px; letter-spacing: -0.02em; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px; }
  .card {
    background: #111827; border: 2px solid rgba(255,255,255,0.14); border-radius: 24px;
    padding: 44px 36px; min-height: 360px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .num { font-size: 22px; font-weight: 700; color: var(--accentColor, #38BDF8); }
  .body { font-size: 36px; line-height: 1.35; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <h1 id="heading">高效剪辑的三个原则</h1>
    <div class="cards">
      <div class="card" id="c0"><div class="num">STEP 01</div><div class="body" id="s1">01</div></div>
      <div class="card" id="c1"><div class="num">STEP 02</div><div class="body" id="s2">02</div></div>
      <div class="card" id="c2"><div class="num">STEP 03</div><div class="body" id="s3">03</div></div>
    </div>
  </div>
  <script type="module">
    import { useParams } from './__film/film-params.mjs';
    import { ease, stagger } from './__film/motion-primitives.mjs';

    const heading = document.getElementById('heading');
    const cards = [document.getElementById('c0'), document.getElementById('c1'), document.getElementById('c2')];
    const labels = [document.getElementById('s1'), document.getElementById('s2'), document.getElementById('s3')];

    window.film = {
      duration: 5.0,
      sfx: [
        { at: 0.4, id: 'pop_tight', gain: -3, pan: -0.5, label: '步骤一' },
        { at: 1.1, id: 'pop_tight', gain: -3, pan: 0, label: '步骤二' },
        { at: 1.8, id: 'chime_high', gain: -2, pan: 0.5, label: '步骤三' },
      ],
      params: {
        heading: { type: 'text', default: '高效剪辑的三个原则', label: '总标题', maxLength: 28 },
        step1: { type: 'text', default: '01 · 剪辑本身写成纯文本', label: '步骤一', maxLength: 36 },
        step2: { type: 'text', default: '02 · 每一帧只由时间 t 决定', label: '步骤二', maxLength: 36 },
        step3: { type: 'text', default: '03 · 人与 AI 共改同一份工程', label: '步骤三', maxLength: 36 },
        accentColor: { type: 'color', default: '#38BDF8', label: '主题色' },
      },
      frame(t) {
        heading.textContent = param('heading');
        labels[0].textContent = param('step1');
        labels[1].textContent = param('step2');
        labels[2].textContent = param('step3');

        const hp = ease.outCubic(Math.min(1, t / 0.45));
        heading.style.opacity = String(hp);
        heading.style.transform = `translateY(${(1 - hp) * 24}px)`;

        cards.forEach((card, i) => {
          const p = ease.outBack(stagger(t, i, { start: 0.35, step: 0.7, duration: 0.5 }));
          card.style.opacity = String(Math.min(1, Math.max(0, p)));
          card.style.transform = `translateY(${(1 - p) * 40}px) scale(${0.92 + 0.08 * p})`;
          const active = t >= 0.35 + i * 0.7 && (i === 2 || t < 0.35 + (i + 1) * 0.7);
          card.style.borderColor = active ? param('accentColor') : 'rgba(255,255,255,0.14)';
        });
      },
    };
    const param = useParams(window.film);
  </script>
</body>
</html>
