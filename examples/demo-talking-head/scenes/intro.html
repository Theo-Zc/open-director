<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--paper, #f4efe6);
    color: #16181d;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
  }
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(22, 24, 29, 0.06) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(22, 24, 29, 0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: calc(var(--showGrid, 1));
  }
  .stage-wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 72px 84px;
    gap: 48px;
  }
  .card {
    flex: 1;
    background: #ffffff;
    border: 2px solid #16181d;
    border-radius: 20px;
    padding: 40px 44px;
    box-shadow: 12px 12px 0 var(--accent, #2fd3b4);
  }
  .brand-pill {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    background: var(--accent, #2fd3b4);
    color: #082f2b;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 18px;
  }
  h1 {
    margin: 0 0 14px;
    font-size: 48px;
    line-height: 1.2;
  }
  p {
    margin: 0;
    font-size: 22px;
    color: #4b5563;
  }
  .avatar-placeholder {
    width: 280px;
    height: 280px;
    border-radius: 999px;
    background: var(--accent, #2fd3b4);
    border: 3px solid #16181d;
    display: grid;
    place-items: center;
    font-weight: 700;
    font-size: 20px;
    color: #082f2b;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="stage-wrap">
    <div class="card">
      <div class="brand-pill" id="brand">Open Director</div>
      <h1 id="headline">先说明条件，再给出判断</h1>
      <p id="sub">把要点放在一张纸上 · 按时间 t 确定性出帧</p>
    </div>
    <div class="avatar-placeholder" data-film-sample="人物口播窗">人物占位</div>
  </div>
  <script type="module">
    import { useParams } from './__film/film-params.mjs';

    const card = document.querySelector('.card');
    const avatar = document.querySelector('.avatar-placeholder');
    const brandEl = document.getElementById('brand');
    const headlineEl = document.getElementById('headline');
    const subEl = document.getElementById('sub');

    const easeOutCubic = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

    window.film = {
      duration: 4.0,
      params: {
        brandName: { type: 'text', default: 'Open Director', label: '品牌名', maxLength: 24 },
        headline: { type: 'text', default: '先说明条件，再给出判断', label: '主标题', maxLength: 32 },
        subtitle: { type: 'text', default: '把要点放在一张纸上 · 按时间 t 确定性出帧', label: '副标题', maxLength: 48 },
        accent: { type: 'color', default: '#2fd3b4', label: '强调色' },
        paper: { type: 'color', default: '#f4efe6', label: '纸面底色' },
        showGrid: { type: 'toggle', default: true, label: '背景网格' },
      },
      frame(t) {
        brandEl.textContent = param('brandName');
        headlineEl.textContent = param('headline');
        subEl.textContent = param('subtitle');

        const cardP = easeOutCubic(t / 0.65);
        card.style.opacity = String(0.35 + 0.65 * cardP);
        card.style.transform = `perspective(900px) rotateY(${(1 - cardP) * -10}deg) translateY(${(1 - cardP) * 24}px)`;

        const avP = easeOutCubic((t - 0.1) / 0.65);
        avatar.style.opacity = String(0.25 + 0.75 * avP);
        avatar.style.transform = `scale(${0.86 + 0.14 * avP})`;
      },
    };

    const param = useParams(window.film);
  </script>
</body>
</html>
